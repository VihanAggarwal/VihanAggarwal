[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b1k26"
version = "0.1.0"
description = "Policy serving, control and evaluation tooling for the BEHAVIOR-1K 2026 Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "msgpack>=1.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
control = ["scipy>=1.10"]
test = ["pytest>=7", "scipy>=1.10", "requests>=2.28"]

[project.scripts]
b1k26-serve = "b1k26.server:main"
b1k26-worker = "b1k26.worker:main"
b1k26-probe = "b1k26.client:main"
b1k26-score = "b1k26.scoring:main"
b1k26-select = "b1k26.selection:main"
b1k26-plan = "b1k26.orchestrate:main"
b1k26-package = "b1k26.package:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
b1k26 = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
